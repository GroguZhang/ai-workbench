name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Python 语法检查
        run: |
          python -m compileall -q sports-card-vault productivity-apps research-agents system-automations \
            || (echo "存在语法错误的 Python 文件"; exit 1)

      - name: JSON 有效性检查
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*.json'):
              if '.git' in p.parts:
                  continue
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  bad.append(f'{p}: {e}')
          print('\n'.join(bad) if bad else 'JSON OK')
          sys.exit(1 if bad else 0)
          PY

      - name: 占位配置完整性
        run: |
          for f in sports-card-vault/cardhobby-radar/.env.example \
                   sports-card-vault/scrapling-assistant/.env.example \
                   sports-card-vault/vision-break-parser/.env.example \
                   system-automations/dsh-synology-docker/.env.example; do
            test -f "$f" || { echo "缺少 $f"; exit 1; }
          done
          echo "env examples OK"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sports-card-vault/card-vault/requirements.txt

      - name: 安装 OpenCV 运行时依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-0 libgomp1

      - name: 安装生产依赖（与 Docker 镜像同源，避免测试环境和线上不一致）
        working-directory: sports-card-vault/card-vault
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: 安装测试用轻量依赖
        run: |
          # fastapi 已由 card-vault requirements 带入；scrapling 的接口测试还需要 httpx 与 TestClient 支持
          pip install httpx

      - name: 运行单元测试（全部五个模块）
        run: |
          set -e
          for d in \
            sports-card-vault/card-vault \
            sports-card-vault/cardhobby-radar \
            sports-card-vault/vision-break-parser \
            sports-card-vault/scrapling-assistant \
            productivity-apps/fitness-dashboard; do
            echo "::group::pytest $d"
            (cd "$d" && python -m pytest)
            echo "::endgroup::"
          done

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 只构建 card-vault：scrapling 镜像里有 `scrapling install`（会下载浏览器），
      # 在 CI 里耗时且不稳定，不值得为验证 Dockerfile 语法付这个代价。
      - name: 构建 card-vault 镜像
        run: docker build -t card-vault:ci sports-card-vault/card-vault

      - name: 冒烟测试（容器能否起来并响应健康检查）
        run: |
          docker run -d --name cv-smoke -p 8000:8000 card-vault:ci
          for n in $(seq 1 30); do
            if curl -fsS -m 2 http://127.0.0.1:8000/api/sorts > /dev/null; then
              echo "服务在第 $n 次探测后就绪"
              docker rm -f cv-smoke
              exit 0
            fi
            sleep 2
          done
          echo "健康检查超时，输出容器日志："
          docker logs cv-smoke
          docker rm -f cv-smoke
          exit 1

  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 禁止真实密钥与私有 IP 进入版本库
        run: |
          set +e
          ! grep -rnE 'sk-[A-Za-z0-9]{20,}|AQ\.[A-Za-z0-9_-]{25,}|AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[A-Za-z0-9]{25,}' \
              --include='*.py' --include='*.js' --include='*.html' \
              --include='*.yml' --include='*.yaml' --include='*.json' . \
            | grep -v '\.example'
          echo "未发现真实密钥"

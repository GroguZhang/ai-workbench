# 依赖自动升级：只覆盖 github-actions。
#
# 为什么不开 pip 升级：
# 本项目的 Python 依赖全部是**刻意锁定上限**的（每条都写明了理由），
# 例如 card-vault 被裸下限坑过——拉到不兼容的 Starlette 直接首屏 500。
# 实测开启后 Dependabot 一分钟内开了 8 个 PR，其中 3 个把上限直接抬高一个
# 大版本（plotly <7 → <8、openai <3 → <4、scrapling <0.5 → <0.6），
# 等于自动推翻项目自己的约束。这类升级必须由人在干净环境验过再合。
#
# 真正需要的是「安全告警」，那由 GitHub Security Advisories / Dependabot alerts
# 提供，不需要自动 PR。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(actions)"

# 依赖自动升级：只开 PR，不自动合并。
# 本项目大量依赖是刻意锁定上限的（见各 requirements.txt 的注释），
# 贸然自动合并会绕过「重建环境前先验证」这条经验。
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/sports-card-vault/card-vault"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(card-vault)"

  - package-ecosystem: "pip"
    directory: "/sports-card-vault/scrapling-assistant"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(scrapling)"

  - package-ecosystem: "pip"
    directory: "/sports-card-vault/vision-break-parser"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(vision-break-parser)"

  - package-ecosystem: "pip"
    directory: "/productivity-apps/fitness-dashboard"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(fitness-dashboard)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(actions)"

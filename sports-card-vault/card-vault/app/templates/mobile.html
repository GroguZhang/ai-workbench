<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Card Vault</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Card Vault">
<link rel="apple-touch-icon" href="/pwa-icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0b1220;color:#e2e8f0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}

/* ---------- 顶部 ---------- */
.hd{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid #1e293b;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hd h1{margin:0;font-size:15px;font-weight:700;color:#fbbf24;letter-spacing:.3px}
.hd .sub{font-size:11px;color:#64748b;margin-top:2px}

/* ---------- 卡片外框 ---------- */
.pad{padding:12px}
.card{background:#131d2e;border:1px solid #24314a;border-radius:14px;padding:14px;margin-bottom:10px}
.card.tight{padding:10px 12px}

/* ---------- 主数字 ---------- */
.hero{text-align:center;padding:20px 14px 16px}
.hero .lbl{font-size:12px;color:#94a3b8;letter-spacing:.5px}
.hero .val{font-size:34px;font-weight:800;color:#34d399;margin:6px 0 2px;
  font-variant-numeric:tabular-nums;line-height:1.1}
.hero .delta{font-size:13px;font-weight:600}
.up{color:#f87171}.down{color:#34d399}.flat{color:#94a3b8}

/* ---------- 四宫格 ---------- */
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cell{background:#0f1a2c;border:1px solid #1e2f4a;border-radius:10px;padding:10px 8px;text-align:center}
.cell .k{font-size:10.5px;color:#7f8ea8;margin-bottom:3px}
.cell .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- 区块标题 ---------- */
.sec{display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:#94a3b8;font-weight:600;margin:16px 2px 8px}
.sec .more{font-size:11px;color:#38bdf8;font-weight:500}

/* ---------- Top 榜 ---------- */
.row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed #1e2f4a}
.row:last-child{border-bottom:none}
.row .rank{width:20px;height:20px;flex:0 0 20px;border-radius:6px;background:#1e293b;
  color:#94a3b8;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.row .rank.g1{background:#78350f;color:#fbbf24}
.row .rank.g2{background:#1e3a5f;color:#7dd3fc}
.row .rank.g3{background:#3f2d1a;color:#fcd34d}
.row .info{flex:1;min-width:0}
.row .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:10.5px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .amt{font-size:13px;font-weight:700;color:#fbbf24;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- 维度条 ---------- */
.dim{padding:8px 2px;border-bottom:1px dashed #1e2f4a}
.dim:last-child{border-bottom:none}
.dim .top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.dim .bar{height:5px;background:#1e293b;border-radius:3px;overflow:hidden}
.dim .bar>i{display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,#38bdf8,#34d399);transition:width .4s ease}

/* ---------- tab 切换 ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;background:#131d2e;border:1px solid #24314a;color:#94a3b8;
  font-size:12px;padding:7px 13px;border-radius:20px;font-weight:600}
.tabs button.on{background:#fbbf24;border-color:#fbbf24;color:#0b1220}

/* ---------- 卡片列表 ---------- */
.item{display:flex;gap:10px;align-items:center;background:#131d2e;border:1px solid #24314a;
  border-radius:12px;padding:9px;margin-bottom:7px}
.item img{width:46px;height:64px;object-fit:cover;border-radius:6px;background:#0f1a2c;flex:0 0 46px}
.item .ph{width:46px;height:64px;border-radius:6px;background:#0f1a2c;border:1px dashed #24314a;
  flex:0 0 46px;display:flex;align-items:center;justify-content:center;color:#334155;font-size:16px}
.item .main{flex:1;min-width:0}
.item .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:10.5px;color:#64748b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .price{text-align:right;flex:0 0 auto}
.item .price .n{font-size:13px;font-weight:700;color:#fbbf24;font-variant-numeric:tabular-nums}
.item .price .t{font-size:10px;color:#64748b;margin-top:2px}
.pill{display:inline-block;font-size:9.5px;padding:1px 5px;border-radius:4px;
  background:#1e293b;color:#7dd3fc;margin-left:4px;vertical-align:1px}
.pill.base{background:#1f2937;color:#94a3b8}
.pill.ser{background:#3b1d5e;color:#c4b5fd}

/* ---------- 空态 / 加载 ---------- */
.empty{text-align:center;color:#64748b;font-size:12.5px;padding:26px 12px;line-height:1.7}
.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,#131d2e,#1e2f4a,#131d2e);
  background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ---------- 底部导航 ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(11,18,32,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid #1e293b;padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;text-align:center;padding:9px 0 8px;color:#64748b;text-decoration:none;
  font-size:10.5px;font-weight:600}
.tabbar a .ic{display:block;font-size:19px;line-height:1.2;margin-bottom:1px}
.tabbar a.on{color:#fbbf24}

.view{display:none}
.view.on{display:block}

/* 小圆角按钮 */
.mini{background:#1e293b;border:1px solid #334155;color:#cbd5e1;font-size:11px;
  padding:5px 10px;border-radius:8px;font-weight:600}
.mini:active{background:#334155}

.arch{background:linear-gradient(135deg,#132a3a,#0f1a2c);border:1px solid #1d4e63;
  border-radius:12px;padding:11px 13px;margin-bottom:10px}
.arch .t{font-size:11px;color:#7dd3fc;font-weight:700;margin-bottom:5px}
.arch .n{font-size:20px;font-weight:800;color:#e0f2fe;font-variant-numeric:tabular-nums}
.arch .s{font-size:10.5px;color:#64748b;margin-top:3px}
</style>
</head>
<body>

<div class="hd">
  <h1>⚡ Card Vault</h1>
  <div class="sub" id="hd-sub">正在连接…</div>
</div>

<!-- ============ 概览 ============ -->
<div class="view on" id="view-overview">
  <div class="card hero">
    <div class="lbl">在库总估值</div>
    <div class="val" id="m-value">--</div>
    <div class="delta flat" id="m-delta">加载中</div>
  </div>

  <div class="pad" style="padding-top:0">
    <div class="grid4">
      <div class="cell"><div class="k">在库张数</div><div class="v" id="m-cards">--</div></div>
      <div class="cell"><div class="k">估值覆盖</div><div class="v" id="m-cov">--</div></div>
      <div class="cell"><div class="k">有成本盈亏</div><div class="v" id="m-pnl">--</div></div>
      <div class="cell"><div class="k">收益率</div><div class="v" id="m-pnlpct">--</div></div>
    </div>

    <div class="arch">
      <div class="t">🗄 成交永久档案</div>
      <div class="n" id="m-arch">--</div>
      <div class="s" id="m-arch-sub">卡淘清空也不影响你的历史成交</div>
    </div>
  </div>

  <div class="pad" style="padding-top:0">
    <div class="sec"><span>🏆 最值钱 Top 5</span></div>
    <div id="m-top"><div class="sk"></div></div>
  </div>
</div>

<!-- ============ 卡片列表 ============ -->
<div class="view" id="view-cards">
  <div class="pad">
    <div class="tabs" id="cards-tabs">
      <button class="on" data-f="全部" onclick="filterCards(this,'全部')">全部</button>
      <button data-f="篮球" onclick="filterCards(this,'篮球')">篮球</button>
      <button data-f="足球" onclick="filterCards(this,'足球')">足球</button>
      <button data-f="网球" onclick="filterCards(this,'网球')">网球</button>
      <button data-f="有编" onclick="filterCards(this,'有编')">有编号</button>
      <button data-f="base" onclick="filterCards(this,'base')">base</button>
    </div>
    <div id="m-list"><div class="sk"></div></div>
  </div>
</div>

<!-- ============ 统计 ============ -->
<div class="view" id="view-stats">
  <div class="pad">
    <div class="tabs" id="stats-tabs">
      <button class="on" data-d="sport" onclick="switchDim(this,'sport')">运动</button>
      <button data-d="year" onclick="switchDim(this,'year')">年份</button>
      <button data-d="series" onclick="switchDim(this,'series')">系列</button>
      <button data-d="grader" onclick="switchDim(this,'grader')">评级</button>
      <button data-d="player" onclick="switchDim(this,'player')">球员</button>
    </div>
    <div id="m-dims"><div class="sk"></div></div>
  </div>
</div>

<nav class="tabbar">
  <a href="#overview" class="on" data-v="overview" onclick="showView('overview',this)">
    <span class="ic">📊</span>概览</a>
  <a href="#cards" data-v="cards" onclick="showView('cards',this)">
    <span class="ic">🃏</span>卡片</a>
  <a href="#stats" data-v="stats" onclick="showView('stats',this)">
    <span class="ic">📈</span>统计</a>
</nav>

<script>
var CARDS = [], DIMS = null, CUR_DIM = 'sport', CUR_FILTER = '全部';

function money(n) {
  n = Number(n || 0);
  if (n >= 10000) return '¥' + (n / 10000).toFixed(2) + '万';
  return '¥' + Math.round(n).toLocaleString();
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function parLabel(p) {
  p = String(p || '').toLowerCase();
  if (!p) return '';
  if (p === 'base') return { t: 'base', c: 'base' };
  if (p === 'serialized') return { t: '有编', c: 'ser' };
  return { t: p, c: '' };
}

function showView(v, el) {
  ['overview', 'cards', 'stats'].forEach(function (k) {
    var n = document.getElementById('view-' + k);
    if (n) n.className = 'view' + (k === v ? ' on' : '');
  });
  document.querySelectorAll('.tabbar a').forEach(function (a) {
    a.className = (a.getAttribute('data-v') === v) ? 'on' : '';
  });
  window.scrollTo(0, 0);
  if (v === 'cards' && !CARDS.length) loadCards();
  if (v === 'stats' && !DIMS) loadStats();
}

async function loadOverview() {
  try {
    var d = await (await fetch('/api/mobile/info')).json();
    var sub = document.getElementById('hd-sub');
    sub.textContent = d.cards + ' 张卡片 · 已估值 ' + d.valued_cards + ' 张';

    document.getElementById('m-value').textContent = money(d.total_value);
    document.getElementById('m-cards').textContent = d.cards;
    document.getElementById('m-cov').textContent = (d.coverage || 0) + '%';

    var pnl = document.getElementById('m-pnl');
    if (d.costed_pnl === null || d.costed_pnl === undefined) {
      pnl.textContent = '未设成本'; pnl.style.color = '#64748b';
    } else {
      pnl.textContent = (d.costed_pnl >= 0 ? '+' : '') + money(d.costed_pnl);
      pnl.style.color = d.costed_pnl >= 0 ? '#f87171' : '#34d399';
    }
    var pct = document.getElementById('m-pnlpct');
    if (d.costed_pnl_pct === null || d.costed_pnl_pct === undefined) {
      pct.textContent = '--';
    } else {
      pct.textContent = (d.costed_pnl_pct >= 0 ? '+' : '') + d.costed_pnl_pct + '%';
      pct.style.color = d.costed_pnl_pct >= 0 ? '#f87171' : '#34d399';
    }

    // Top5
    var top = d.top_cards || [];
    if (!top.length) {
      document.getElementById('m-top').innerHTML = '<div class="empty">还没有卡片</div>';
    } else {
      var h = '';
      top.forEach(function (c, i) {
        var pl = parLabel(c.parallel);
        h += '<div class="row"><div class="rank g' + (i + 1) + '">' + (i + 1) + '</div>' +
          '<div class="info"><div class="nm">' + esc(c.player || '未命名') +
          (pl ? '<span class="pill ' + pl.c + '">' + esc(pl.t) + '</span>' : '') + '</div>' +
          '<div class="meta">' + esc((c.year_set || '').slice(0, 26)) + '</div></div>' +
          '<div class="amt">' + money(c.est_raw_price) + '</div></div>';
      });
      document.getElementById('m-top').innerHTML = h;
    }
  } catch (e) {
    document.getElementById('hd-sub').textContent = '连接失败，请检查网络';
  }

  // 档案统计
  try {
    var a = await (await fetch('/api/sales/archive-stats')).json();
    document.getElementById('m-arch').textContent = a.archived_sales + ' 条';
    document.getElementById('m-arch-sub').textContent =
      '覆盖 ' + a.players_covered + ' 位球员' +
      (a.earliest_sale ? ' · 最早 ' + a.earliest_sale : '') +
      ' · 卡淘清空也不丢';
  } catch (e) { /* 忽略 */ }

  // 日变动
  try {
    var s = await (await fetch('/api/portfolio/summary-daily')).json();
    var el = document.getElementById('m-delta');
    if (s.day_delta === null || s.day_delta === undefined) {
      el.textContent = '暂无日对比（明天起会有）';
      el.className = 'delta flat';
    } else {
      var sign = s.day_delta >= 0 ? '▲ +' : '▼ ';
      el.textContent = sign + money(Math.abs(s.day_delta)) +
        (s.day_delta_pct != null ? ' (' + (s.day_delta_pct >= 0 ? '+' : '') + s.day_delta_pct + '%)' : '');
      el.className = 'delta ' + (s.day_delta >= 0 ? 'up' : 'down');
    }
  } catch (e) { /* 忽略 */ }
}

async function loadCards() {
  try {
    var d = await (await fetch('/api/cards')).json();
    CARDS = (d.cards || []).filter(function (c) { return (c.status || '') !== '已售出'; });
    CARDS.sort(function (a, b) { return (b.est_raw_price || 0) - (a.est_raw_price || 0); });
    CARDS_BY_ID = {};
    CARDS.forEach(function (c) { CARDS_BY_ID[c.card_id] = c; });
    renderCards();
  } catch (e) {
    document.getElementById('m-list').innerHTML = '<div class="empty">加载失败</div>';
  }
}

function filterCards(el, f) {
  CUR_FILTER = f;
  document.querySelectorAll('#cards-tabs button').forEach(function (b) { b.className = ''; });
  el.className = 'on';
  renderCards();
}

function renderCards() {
  var list = CARDS.filter(function (c) {
    if (CUR_FILTER === '全部') return true;
    if (CUR_FILTER === '有编') return String(c.parallel || '') === 'serialized';
    if (CUR_FILTER === 'base') return String(c.parallel || '') === 'base';
    return (c.sport || '') === CUR_FILTER;
  });
  var box = document.getElementById('m-list');
  if (!list.length) { box.innerHTML = '<div class="empty">这个筛选下没有卡片</div>'; return; }
  var h = '';
  list.slice(0, 200).forEach(function (c) {
    var pl = parLabel(c.parallel);
    var img = c.img_front
      ? '<img src="' + esc(c.img_front.indexOf('/') === 0 ? c.img_front : '/uploads/' + encodeURIComponent(c.img_front)) +
        '" loading="lazy" onerror="this.style.display=\'none\'">'
      : '<div class="ph">🃏</div>';
        h += '<div class="item" data-cid="' + esc(c.card_id) + '">' + img +
      '<div class="main"><div class="nm">' + esc(c.player || '未命名') +
      (pl ? '<span class="pill ' + pl.c + '">' + esc(pl.t) + '</span>' : '') + '</div>' +
      '<div class="sub">' + esc((c.year_set || '') + (c.card_type ? ' · ' + c.card_type : '')) + '</div></div>' +
      '<div class="price"><div class="n">' + money(c.est_raw_price) + '</div>' +
      '<div class="t">' + esc(c.sport || '') + '</div></div></div>';
  });
  box.innerHTML = h;
  Array.prototype.forEach.call(box.querySelectorAll('.item'), function (el) {
    el.onclick = function () { openCard(el.getAttribute('data-cid')); };
  });
}

async function loadStats() {
  try {
    var d = await (await fetch('/api/stats/dimensions')).json();
    DIMS = d;
    renderDims();
  } catch (e) {
    document.getElementById('m-dims').innerHTML = '<div class="empty">加载失败</div>';
  }
}

function switchDim(el, dim) {
  CUR_DIM = dim;
  document.querySelectorAll('#stats-tabs button').forEach(function (b) { b.className = ''; });
  el.className = 'on';
  renderDims();
}

function renderDims() {
  if (!DIMS) return;
  var rows = DIMS['by_' + CUR_DIM] || [];
  var box = document.getElementById('m-dims');
  if (!rows.length) { box.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  var maxV = 0;
  rows.forEach(function (r) { if ((r.value || 0) > maxV) maxV = r.value; });
  var h = '';
  rows.slice(0, 25).forEach(function (r) {
    var pct = maxV > 0 ? Math.max(2, (r.value / maxV) * 100) : 0;
    h += '<div class="dim"><div class="top"><span>' + esc(r.key || '—') +
      ' <span style="color:#64748b">· ' + (r.count || 0) + ' 张</span></span>' +
      '<span style="color:#34d399;font-weight:700">' + money(r.value) + '</span></div>' +
      '<div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div></div>';
  });
  box.innerHTML = h;
}

// 启动
loadOverview();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  });
}

// ===== 详情弹层 =====
var CARDS_BY_ID = {};
function openCard(cid) {
  var c = CARDS_BY_ID[cid];
  if (!c) return;
  var pl = parLabel(c.parallel);
  var html = "";
  var imgs = [];
  if (c.img_front) imgs.push({ u: "/uploads/" + encodeURIComponent(c.img_front), t: "正面" });
  if (c.img_back) imgs.push({ u: "/uploads/" + encodeURIComponent(c.img_back), t: "背面" });
  if (imgs.length) {
    html += '<div style="display:flex;gap:8px;justify-content:center;margin-bottom:12px">';
    imgs.forEach(function (im) {
      html += '<div style="text-align:center"><img src="' + im.u +
        '" style="max-height:230px;max-width:44vw;border-radius:8px;background:#0f1a2c"' +
        ' onerror="this.style.opacity=.25"><div style="font-size:10px;color:#64748b;margin-top:3px">' + im.t + '</div></div>';
    });
    html += "</div>";
  }
  html += '<div style="font-size:16px;font-weight:700;margin-bottom:4px">' + esc(c.player || "未命名") +
    (pl ? '<span class="pill ' + pl.c + '">' + esc(pl.t) + "</span>" : "") + "</div>";
  html += '<div style="font-size:12px;color:#94a3b8;margin-bottom:12px">' +
    esc((c.year_set || "") + (c.card_type ? " · " + c.card_type : "")) + "</div>";

  var rows = [
    ["当前估值", c.est_raw_price ? money(c.est_raw_price) : "未估值", "#fbbf24"],
    ["成本价", c.cost_price ? money(c.cost_price) : "未记录", "#94a3b8"],
    ["体育项目", c.sport || "—", "#e2e8f0"],
    ["编数", c.serial || "—", "#e2e8f0"],
    ["评级", (c.grader ? c.grader + " " + (c.grade_score || "") : "裸卡"), "#e2e8f0"],
    ["版别", c.parallel || "未标注", "#e2e8f0"],
    ["卡号", c.card_number || "—", "#e2e8f0"],
    ["状态", c.status || "—", "#e2e8f0"]
  ];
  html += "<div style=\"border-top:1px solid #24314a\">";
  rows.forEach(function (r) {
    html += '<div style="display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px dashed #1e2f4a;font-size:12.5px">' +
      '<span style="color:#94a3b8">' + r[0] + '</span><span style="color:' + r[2] + ';font-weight:600">' + esc(r[1]) + '</span></div>';
  });
  html += "</div>";

  if (c.notes) {
    html += '<div style="margin-top:12px;font-size:11.5px;color:#94a3b8;line-height:1.6;background:#0f1a2c;padding:9px;border-radius:8px">' +
      esc(String(c.notes).slice(0, 400)) + "</div>";
  }

  document.getElementById("sheet-body").innerHTML = html;
  document.getElementById("sheet").style.display = "block";
  document.body.style.overflow = "hidden";
}
function closeSheet() {
  document.getElementById("sheet").style.display = "none";
  document.body.style.overflow = "";
}
</script>
<!-- ===== 卡片详情弹层 ===== -->
<div id="sheet" style="display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);">
  <div style="position:absolute;left:0;right:0;bottom:0;background:#131d2e;border-radius:18px 18px 0 0;
       max-height:88vh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
       border-top:2px solid #fbbf24;">
    <div style="width:38px;height:4px;background:#334155;border-radius:2px;margin:0 auto 12px"></div>
    <div id="sheet-body"></div>
    <button class="mini" style="width:100%;margin-top:14px;padding:11px" onclick="closeSheet()">关闭</button>
  </div>
</div>
</body>
</html>

services:
  dsh:
    build: .
    image: dsh-nas:0.1.0-rc.6
    container_name: dsh
    restart: unless-stopped
    # host 网络：让容器里的 dsh 直接监听群晖本机的 127.0.0.1:58838。
    # （DSH 只允许回环监听，不能用 ports 映射——那会连不到容器回环地址。）
    network_mode: host
    environment:
      # 方式一：从宿主机环境变量注入（在 .env 里填 DEEPSEEK_API_KEY=sk-你的key）
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      # 方式二（更省事）：不填 Key，启动后在网页里 设置→模型 粘贴保存即可。
      #
      # 用群晖反向代理访问时，取消下面这行注释（填反向代理「来源」的主机:端口，
      # 多个用空格分隔；域名也行，但要与浏览器地址栏完全一致）：
      # DSH_TRUSTED_HOST: "192.168.1.5:8443"
      #
      # 关闭遥测（可选）：
      # DSH_TELEMETRY_DISABLED: "1"
    volumes:
      # 所有数据（会话、凭据、设置）都存这里，删容器/升级都不丢
      - ./dsh-data:/root/.dsh
